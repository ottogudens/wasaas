name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: API - Typecheck
        run: cd apps/api && npx tsc --noEmit

      - name: Bot Engine - Typecheck
        run: cd apps/bot-engine && npx tsc --noEmit

      - name: Web - Typecheck
        run: cd apps/web && npx tsc --noEmit

      - name: Lint (Global)
        run: npm run lint --if-present

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        
      - name: API - Unit Tests
        run: cd apps/api && npm run test

  test-frontend:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: cd apps/web && npx playwright install --with-deps

      - name: Web - Smoke Tests
        run: cd apps/web && npx playwright test

  docker-build-test:
    name: Docker Build Checks
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build -t wasaas/api -f apps/api/Dockerfile .

      - name: Build Bot Engine Docker Image
        run: docker build -t wasaas/bot-engine -f apps/bot-engine/Dockerfile .

      - name: Build Web Docker Image
        run: docker build -t wasaas/web -f apps/web/Dockerfile .
